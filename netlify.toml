[build]
  command = "npm install && npx astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  NPM_CONFIG_PRODUCTION = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/selection"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"



[[redirects]]
  from = "/piece/:slug"
  to = "/piece-live"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/atelier"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
